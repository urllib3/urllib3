repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: 75992aaa40730136014f34227e0135f63fc951b4 # frozen: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py310-plus"]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 4160603246a6b365d4a2af661c6d71b0a0f50478 # frozen: 26.5.1
    hooks:
      - id: black
        args: ["--target-version", "py310"]

  - repo: https://github.com/PyCQA/isort
    rev: 131f4adcd5582bfc53928ab0d740eceb8b506b6c # frozen: 9.0.1
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/flake8
    rev: 7eccf20b526fe4f2230bf9afeeef2fc9f97faf8d # frozen: 7.4.1
    hooks:
      - id: flake8
        additional_dependencies: [flake8-2020]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 9b16a472943852b803af3785c45041dcf10b9f12 # frozen: 0.12.18
    hooks:
      - id: uv-lock

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: ffb6a759a979008c0e6dff86e39f4745a2d9eac4 # frozen: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript]
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: 809d037d62978decc620b5a55e8ee5b8b54d8d65 # frozen: v10.11.0
    hooks:
      - id: eslint
        args: ["--fix"]
        additional_dependencies:
          # Configuring additional dependencies replaces the hook defaults,
          # so ESLint itself must be included explicitly.
          - "eslint@10.11.0"
          # ESLint 10 flat config provides recommended rules and worker globals
          # through these separate packages.
          - "@eslint/js@10.0.1"
          - "globals@17.12.0"

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "Skip Changelog"
    ignore:
      # Ignore all patch releases as we can manually
      # upgrade if we run into a bug and need a fix.
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    cooldown:
      default-days: 7
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "quarterly"
    # Combine all pre-commit hook updates into one pull request.
    groups:
      pre-commit:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "Skip Changelog"
    cooldown:
      default-days: 7
